<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
<defs>
  <style>
    .sans{font-family:Poppins,Inter,Arial,sans-serif}
    .display{font-family:Anton,sans-serif;text-transform:uppercase}
  </style>
</defs>

<!-- Background -->
<rect width="1440" height="900" fill="#F2F4F7"/>

<!-- Section -->
<g transform="translate(96 60)">
  <!-- Header -->
  <rect width="48" height="48" rx="0" fill="#7C3AED"/>
  <text x="14" y="32" class="sans" font-size="20" fill="#fff" font-weight="700">&#x1F4BB;</text>
  <text x="64" y="22" class="sans" font-size="11" font-weight="700" letter-spacing="2" fill="#047DA0">TECHNOLOGY-ENABLED LEARNING</text>
  <text x="0" y="80" class="display" font-size="42" fill="#2F313A">DIGITAL LEARNING</text>
  <text x="0" y="115" class="sans" font-size="15" fill="#5B6270">At Apollo Vidyalayam, technology is seamlessly integrated into the teaching-learning</text>
  <text x="0" y="138" class="sans" font-size="15" fill="#5B6270">process to prepare students for an increasingly digital world.</text>
</g>

<!-- Image Carousel Area -->
<g transform="translate(96 230)">
  <!-- Carousel container -->
  <rect width="1248" height="320" rx="0" fill="#E8EDF2"/>
  
  <!-- Image 1 -->
  <rect x="0" y="0" width="400" height="320" fill="#047DA0" opacity=".15"/>
  <rect x="30" y="30" width="340" height="220" rx="0" fill="#047DA0" opacity=".3"/>
  <text x="110" y="155" class="sans" font-size="14" fill="#047DA0" font-weight="600">Student using computer</text>
  <text x="80" y="275" class="sans" font-size="12" fill="#5B6270">Smart Classroom Session</text>
  
  <!-- Image 2 -->
  <rect x="420" y="0" width="400" height="320" fill="#7C3AED" opacity=".1"/>
  <rect x="450" y="30" width="340" height="220" rx="0" fill="#7C3AED" opacity=".2"/>
  <text x="540" y="155" class="sans" font-size="14" fill="#7C3AED" font-weight="600">AI-Enabled Learning</text>
  <text x="530" y="275" class="sans" font-size="12" fill="#5B6270">Technology in Action</text>
  
  <!-- Image 3 -->
  <rect x="840" y="0" width="408" height="320" fill="#047DA0" opacity=".1"/>
  <rect x="870" y="30" width="348" height="220" rx="0" fill="#047DA0" opacity=".2"/>
  <text x="950" y="155" class="sans" font-size="14" fill="#047DA0" font-weight="600">Interactive Boards</text>
  <text x="950" y="275" class="sans" font-size="12" fill="#5B6270">Digital Resources</text>

  <!-- Scroll arrows -->
  <circle cx="40" cy="160" r="20" fill="#fff" stroke="#047DA0" stroke-width="2"/>
  <path d="M45 160l-8-6v12z" fill="#047DA0"/>
  <circle cx="1208" cy="160" r="20" fill="#fff" stroke="#047DA0" stroke-width="2"/>
  <path d="M1203 160l8-6v12z" fill="#047DA0"/>

  <!-- Dot indicators -->
  <circle cx="594" cy="300" r="5" fill="#047DA0"/>
  <circle cx="614" cy="300" r="5" fill="#047DA0" opacity=".3"/>
  <circle cx="634" cy="300" r="5" fill="#047DA0" opacity=".3"/>
  <circle cx="654" cy="300" r="5" fill="#047DA0" opacity=".3"/>
</g>

<!-- Cards Section -->
<g transform="translate(96 590)">
  <text x="0" y="0" class="sans" font-size="14" font-weight="700" fill="#2F313A">Digital Learning Highlights</text>
  
  <!-- Card 1: Smart Classrooms -->
  <g transform="translate(0 30)">
    <rect width="390" height="200" rx="0" fill="#FFFFFF" stroke="#DEE2E8"/>
    <rect width="390" height="4" fill="#047DA0"/>
    <text x="24" y="40" class="display" font-size="16" fill="#047DA0">SMART CLASSROOMS</text>
    <text x="24" y="70" class="sans" font-size="13" fill="#5B6270">28 classrooms are equipped with</text>
    <text x="24" y="90" class="sans" font-size="13" fill="#5B6270">smart boards, creating interactive and</text>
    <text x="24" y="110" class="sans" font-size="13" fill="#5B6270">engaging learning experiences through</text>
    <text x="24" y="130" class="sans" font-size="13" fill="#5B6270">multimedia content and digital</text>
    <text x="24" y="150" class="sans" font-size="13" fill="#5B6270">teaching resources.</text>
    <!-- Metric -->
    <text x="24" y="182" class="display" font-size="28" fill="#047DA0">28</text>
    <text x="72" y="182" class="sans" font-size="12" fill="#747C89">Classrooms</text>
  </g>
  
  <!-- Card 2: AI-Enabled Learning -->
  <g transform="translate(420 30)">
    <rect width="390" height="200" rx="0" fill="#FFFFFF" stroke="#DEE2E8"/>
    <rect width="390" height="4" fill="#7C3AED"/>
    <text x="24" y="40" class="display" font-size="16" fill="#7C3AED">AI-ENABLED LEARNING</text>
    <text x="24" y="70" class="sans" font-size="13" fill="#5B6270">AI-based learning tools are introduced</text>
    <text x="24" y="90" class="sans" font-size="13" fill="#5B6270">from Kindergarten onwards as part of</text>
    <text x="24" y="110" class="sans" font-size="13" fill="#5B6270">the computer education programme,</text>
    <text x="24" y="130" class="sans" font-size="13" fill="#5B6270">fostering digital literacy and</text>
    <text x="24" y="150" class="sans" font-size="13" fill="#5B6270">future-ready skills from an early age.</text>
    <!-- Metric -->
    <text x="24" y="182" class="display" font-size="28" fill="#7C3AED">KG+</text>
    <text x="92" y="182" class="sans" font-size="12" fill="#747C89">From Kindergarten</text>
  </g>
  
  <!-- Card 3: Technology-Integrated -->
  <g transform="translate(840 30)">
    <rect width="408" height="200" rx="0" fill="#FFFFFF" stroke="#DEE2E8"/>
    <rect width="408" height="4" fill="#F2C230"/>
    <text x="24" y="40" class="display" font-size="16" fill="#2F313A">TECHNOLOGY-INTEGRATED</text>
    <text x="24" y="70" class="sans" font-size="13" fill="#5B6270">Digital resources, interactive lessons,</text>
    <text x="24" y="90" class="sans" font-size="13" fill="#5B6270">and technology-driven methodologies</text>
    <text x="24" y="110" class="sans" font-size="13" fill="#5B6270">encourage collaboration, creativity,</text>
    <text x="24" y="130" class="sans" font-size="13" fill="#5B6270">critical thinking, and experiential</text>
    <text x="24" y="150" class="sans" font-size="13" fill="#5B6270">learning across subjects.</text>
    <!-- Metric -->
    <text x="24" y="182" class="display" font-size="28" fill="#F2C230">100%</text>
    <text x="108" y="182" class="sans" font-size="12" fill="#747C89">Digital Coverage</text>
  </g>
</g>

<!-- Side strokes -->
<rect x="0" y="0" width="10" height="900" fill="#047DA0"/>
<rect x="1430" y="0" width="10" height="900" fill="#047DA0"/>
</svg>